services:

  db:
    image: mariadb:10.11.14
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    env_file:
      - db.env
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -e "select 1" "$$MYSQL_DATABASE" >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    networks:
      - rezeptbuch

  redis:
    image: redis:8.2.2
    command: --appendonly yes
    volumes:
      - redisStorage:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rezeptbuch

  api:
    build: ./api
    restart: always
    environment:
      - MYSQL_HOST=db
      - IMAGE_DIRECTORY=/usr/src/images
    volumes:
      - images:/usr/src/images
    env_file:
      - db.env
      - api/.env
    # app.py opens its first db connection at import time, so a worker that boots
    # before mariadb is accepting connections dies and restart-loops.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Unauthenticated and touches neither db nor redis: a liveness check for
      # gunicorn itself, not for the backends above.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/webpush_public_key"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    networks:
      - rezeptbuch

  ui:
    build: ./ui
    restart: always
    depends_on:
      - api
    env_file:
      - ui/.env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks:
      - rezeptbuch

  rezeptbuch:
    build: ./proxy
    container_name: rezeptbuch
    restart: always
    depends_on:
      - ui
    networks:
      - rezeptbuch
      - system-proxy_default

volumes:
  redisStorage:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/niklas/rezeptbuch/db
  images:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/niklas/rezeptbuch/images

networks:
  rezeptbuch:
    driver: bridge
  system-proxy_default:
    external: true
